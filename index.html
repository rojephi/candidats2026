<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Candidatures — Élections générales 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<style>
:root{--bg:#f6f4ef;--card:#fff;--ink:#1b1f2a;--muted:#5d6472;--line:#e3dfd6;--accent:#0f3d5e;--accent2:#b8862b;--f:#b4436c;--m:#2f6f8f;--empty:#c0392b;--radius:10px}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Source Sans 3",system-ui,sans-serif;font-size:16px;line-height:1.4}
h1,h2,h3{font-family:"Source Serif 4",Georgia,serif;margin:0}
button{font:inherit;cursor:pointer}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}
header{background:var(--accent);color:#fff}
header .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:14px;padding-bottom:14px;flex-wrap:wrap}
header h1{font-size:24px}
header .sub{font-size:14px;opacity:.8;margin-top:2px}
.stripe{height:4px;background:var(--accent2)}
.lang{display:flex;border:1px solid rgba(255,255,255,.4);border-radius:999px;overflow:hidden}
.lang button{background:transparent;border:0;color:#fff;padding:5px 12px;font-size:14px}
.lang button[aria-pressed=true]{background:#fff;color:var(--accent);font-weight:600}
nav.races{display:flex;gap:6px;margin:18px 0 8px;flex-wrap:wrap}
nav.races button{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:7px 15px;font-weight:600;color:var(--ink)}
nav.races button[aria-current=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
.status{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;font-size:14px;color:var(--muted);margin-bottom:14px}
.phase{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff}
.phase button{border:0;background:#fff;padding:6px 12px;font-size:14px;font-weight:600;color:var(--muted)}
.phase button[aria-pressed=true]{background:var(--accent);color:#fff}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi .v{font-size:28px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi .l{font-size:13px;color:var(--muted)}
.kpi .s{font-size:12px;color:var(--muted);margin-top:2px}
.kpi.warn .v{color:var(--empty)}
.pending{background:#fff4d6;border:1px solid #ecd9a4;color:#7a5300;border-radius:8px;padding:10px 14px;font-size:14px;margin-top:12px}
.grid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px;margin-top:16px}
@media (max-width:860px){.grid{grid-template-columns:1fr}}
.mapcard{position:relative}
.maptools{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px;align-items:center}
.maptools button{background:#f1eee8;border:1px solid var(--line);border-radius:6px;padding:5px 10px;font-size:14px;color:var(--ink)}
.maptools button[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:#fff}
.maptools label{font-size:13px;color:var(--muted);margin-left:auto;display:flex;gap:5px;align-items:center}
svg.map{width:100%;height:auto;display:block}
svg.map path.dept{stroke:#fff;stroke-width:1.2;cursor:pointer;transition:fill .4s}
svg.map path.dept:hover,svg.map path.dept:focus{stroke:var(--ink);stroke-width:2;outline:none}
svg.map path.dept.sel{stroke:var(--ink);stroke-width:2.6}
svg.map circle.b{fill:rgba(15,61,94,.55);stroke:#fff;stroke-width:.8;cursor:pointer}
svg.map circle.b:hover{fill:rgba(15,61,94,.9)}
svg.map circle.b.zero{fill:#fff;stroke:var(--empty);stroke-width:1.6}
svg.map circle.b.sel{stroke:var(--ink);stroke-width:2.5}
svg.map text{font-size:11px;font-weight:600;fill:var(--ink);pointer-events:none;paint-order:stroke;stroke:#fff;stroke-width:3px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted);margin-top:6px;align-items:center}
.legend .grad{width:130px;height:10px;border-radius:3px}
.dot{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:#fff;padding:8px 10px;border-radius:8px;font-size:13px;min-width:170px;opacity:0;transition:opacity .15s;z-index:5}
.tip b{display:block;font-size:14px;margin-bottom:3px}
.tip .r{display:flex;gap:10px;justify-content:space-between}
.detail h3{font-size:19px;margin-bottom:2px}
.detail .meta{font-size:13px;color:var(--muted);margin-bottom:10px}
.detail .back{background:none;border:0;color:var(--accent);font-weight:600;padding:0 0 8px;font-size:14px}
.detail .scroll{max-height:470px;overflow:auto;margin-right:-8px;padding-right:8px}
.unit{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:7px 4px;border-bottom:1px solid #f0ede6;cursor:pointer;border-radius:4px}
.unit:hover{background:#f6f4ef}
.unit .n{font-weight:600;font-size:15px}
.unit .x{font-size:12px;color:var(--muted)}
.unit .c{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.unit .c.zero{color:var(--empty)}
.cand{padding:6px 0;border-bottom:1px solid #f0ede6;display:flex;gap:8px;align-items:baseline}
.cand .n{font-weight:600}
.cand .x{font-size:12px;color:var(--muted)}
.sx{font-size:11px;font-weight:700;border-radius:4px;padding:0 5px;color:#fff;flex:none}
.sx.F{background:var(--f)}.sx.M{background:var(--m)}
.badge{font-size:11px;font-weight:700;border-radius:4px;padding:1px 6px;background:#e6f1e8;color:#1f6b35;margin-left:4px}
.cartel{border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin:8px 0}
.cartel .h{font-weight:700;font-size:14px;margin-bottom:2px}
.cartel .cand{border:0;padding:2px 0}
.hint{color:var(--muted);font-size:15px;padding:24px 4px;text-align:center}
.bars .br{display:grid;grid-template-columns:110px 1fr 54px;gap:8px;align-items:center;font-size:14px;padding:3px 0}
.bars .br .t{height:12px;background:#eeebe4;border-radius:3px;overflow:hidden}
.bars .br .t i{display:block;height:100%;background:var(--accent)}
.bars .br .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.bars .br .nb{text-align:right;font-variant-numeric:tabular-nums}
section{margin-top:22px}
.sec-head{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.sec-head h2{font-size:20px}
.sec-head .note{font-size:13px;color:var(--muted)}
.filters{display:flex;gap:8px;flex-wrap:wrap}
.filters input,.filters select{font:inherit;font-size:14px;padding:6px 10px;border:1px solid var(--line);border-radius:6px;background:#fff}
table{width:100%;border-collapse:collapse;font-size:14px;background:#fff}
th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums}
th.l,td.l{text-align:left}
th{font-size:12px;text-transform:uppercase;letter-spacing:.3px;color:var(--muted);position:sticky;top:0;background:#fff;cursor:pointer;white-space:nowrap}
.tblscroll{overflow:auto;max-height:520px;border:1px solid var(--line);border-radius:var(--radius)}
.pager{display:flex;gap:8px;align-items:center;justify-content:flex-end;font-size:14px;color:var(--muted);margin-top:8px}
.pager button{background:#fff;border:1px solid var(--line);border-radius:6px;padding:4px 10px}
.pager button:disabled{opacity:.4;cursor:default}
.trendwrap svg{width:100%;height:auto;display:block}
.trendwrap .axis text{font-size:11px;fill:var(--muted)}
.trendwrap .axis path,.trendwrap .axis line{stroke:#d6d1c6}
.pres{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.pres .card{padding:12px 14px}
.pres .n{font-weight:700;font-size:16px}
.pres .x{font-size:13px;color:var(--muted)}
footer{margin:30px 0 40px;font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:14px}
.hide{display:none!important}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div><h1 data-i18n="title"></h1><div class="sub" data-i18n="subtitle"></div></div>
    <div class="lang" role="group" aria-label="Langue / Lang">
      <button data-lang="fr" aria-pressed="true">Français</button>
      <button data-lang="ht" aria-pressed="false">Kreyòl</button>
    </div>
  </div>
  <div class="stripe"></div>
</header>

<main class="wrap">
  <nav class="races" id="tabs" aria-label="Postes"></nav>
  <div class="status" id="status"></div>

  <div class="card" id="kpis"></div>

  <div class="grid" id="mapgrid">
    <div class="card mapcard" id="mapcard">
      <div class="maptools" id="maptools"></div>
      <svg class="map" id="map" viewBox="0 0 640 470" role="img"></svg>
      <div class="legend" id="legend"></div>
      <div class="tip" id="tip"></div>
    </div>
    <div class="card detail" id="detail"></div>
  </div>
  <div id="presgrid" class="pres hide" style="margin-top:16px"></div>

  <section>
    <div class="sec-head"><h2 data-i18n="trendTitle"></h2><div class="note" data-i18n="trendNote"></div></div>
    <div class="card trendwrap"><svg id="trend" viewBox="0 0 900 260"></svg><div class="legend" id="trendLegend"></div></div>
  </section>

  <section>
    <div class="sec-head"><h2 data-i18n="partiesTitle"></h2>
      <div class="filters"><input type="search" id="pSearch"></div></div>
    <div class="tblscroll" id="parties"></div>
  </section>

  <section>
    <div class="sec-head"><h2 id="listTitle"></h2>
      <div class="filters"><select id="lDept"></select><input type="search" id="lSearch"></div></div>
    <div class="tblscroll" id="list"></div>
    <div class="pager" id="pager"></div>
  </section>

  <footer>
    <div data-i18n="footer1"></div>
    <div data-i18n="footer2" style="margin-top:6px"></div>
  </footer>
</main>

const state={lang:"fr",tab:"all",phase:"online",view:"count",bubbles:true,dept:null,unit:null,lq:"",ld:"",pq:"",page:0,sort:{k:"total",d:-1}};

const t=(k,v)=>{let s=I18N[state.lang][k]??k; if(v) for(const x in v) s=s.replace("{"+x+"}",v[x]); return s;};

/* Nombre de sièges / unités par département */
const UNITS={circ:{},com:{},sec:{}};
for(const [k,v] of Object.entries(D.circs)) (UNITS.circ[v[1]]??=[]).push(+k);
for(const [k,v] of Object.entries(D.communes)) (UNITS.com[v[2]]??=[]).push(k);

const unitTotal=u=>DCODES.reduce((a,d)=>a+(UNITS[u][d]?.length||0),0);
const unitName=(u,k)=> u==="circ"? title(D.circs[k][0]) : u==="com"? comName(k) : title(D.sections[k]?.[0]||k);
const comName=k=> state.lang==="ht" && D.communes[k]?.[1] ? title(D.communes[k][1]) : title(D.communes[k]?.[0]||k);

/* ---------------- Statistiques ---------------- */
function stats(key,dept){
  let c=pool(key); if(dept) c=c.filter(x=>x[DP]===dept);
  const s={n:c.length,f:c.filter(x=>x[SX]==="F").length,struct:new Set(c.map(x=>x[ST])).size,c};
  if(key==="maire"||key==="casec"||key==="asec") s.cartels=new Set(c.map(cartelKey)).size;
  const u=UNIT[key];
  if(u){ const all=dept?(UNITS[u][dept]||[]):DCODES.flatMap(d=>UNITS[u][d]||[]); const with_=new Set(c.map(x=>x[G]).filter(g=>u!=="sec"||D.sections[g]));
    s.units=all.length; s.covered=all.filter(x=>with_.has(x)).length; s.emptyList=all.filter(x=>!with_.has(x)); }
  return s;
}
function deptMetric(key,d){
  const s=stats(key,d); const all=D.pos[key].c.filter(x=>x[DP]===d);
  if(state.view==="women") return s.n? s.f/s.n : null;
  if(state.view==="depot") return all.length? all.filter(x=>x[DEP]).length/all.length : null;
  if(state.view==="perSeat" && UNIT[key]) return s.units? (s.cartels??s.n)/s.units : null;
  return s.cartels??s.n;
}

    B=B.filter(b=>b.lat!=null);

    .attr("cx",b=>proj([b.lon,b.lat])[0]).attr("cy",b=>proj([b.lon,b.lat])[1]).attr("r",b=>b.n?Math.max(2.5,r(b.n)):3)

    .on("click",(e,b)=>{e.stopPropagation(); state.dept=b.d; state.unit={id:b.id,u:b.u,k:b.k}; render(); scrollDetail();});

/* ---------------- Panneau de détail ---------------- */
const posLabel=r=>t("pos"+r);
function candLine(c,extra=""){ return `<div class="cand"><span class="sx ${c[SX]}">${c[SX]}</span><div><div class="n">${esc(c[N])}${c[DEP]?`<span class="badge">${t("depot")}</span>`:""}</div><div class="x">${esc(c[ST])}${extra}</div></div></div>`; }
function cartelsHtml(list){
  const g=d3.groups(list,x=>x[ST]).sort((a,b)=>a[0].localeCompare(b[0]));
  return g.map(([st,cs])=>`<div class="cartel"><div class="h">${esc(st)}</div>${cs.sort((a,b)=>a[RK]-b[RK]).map(c=>`<div class="cand"><span class="sx ${c[SX]}">${c[SX]}</span><div><span class="n">${esc(c[N])}</span> <span class="x">· ${posLabel(c[RK])}</span>${c[DEP]?`<span class="badge">${t("depot")}</span>`:""}</div></div>`).join("")}</div>`).join("");
}
function structBars(c,n=8){
  const g=d3.rollups(c,v=>v.length,x=>x[ST]).sort((a,b)=>b[1]-a[1]).slice(0,n); const m=g[0]?.[1]||1;
  return `<div class="bars">${g.map(([s,v])=>`<div class="br"><span class="nm" title="${esc(s)}">${esc(s)}</span><span class="t"><i style="width:${100*v/m}%"></i></span><span class="nb">${v}</span></div>`).join("")}</div>`;
}
function renderDetail(){
  const el=document.getElementById("detail"); const key=mapKey(); const d=state.dept;
  if(!d){ el.innerHTML=`<div class="hint">${t("clickDept")}</div>`; return; }
  if(!key){ // ensemble

    const all=POSKEYS.filter(k=>k!=="president").flatMap(k=>pool(k).filter(x=>x[DP]===d));
    el.innerHTML=`<h3>${esc(dn(d))}</h3><div class="meta">${fmt(all.length)} ${t("candidates")}</div>${rows}<h3 style="font-size:15px;margin:14px 0 6px">${t("topStruct")}</h3>${structBars(all)}`; return;
  }
  const u=UNIT[key]; const s=stats(key,d);
  if(state.unit){ // une unité (circonscription ou commune)
    const un=state.unit; let body="", meta="";
    if(un.u==="circ"){ const c=s.c.filter(x=>x[G]===un.k); meta=`${t("depute")} · ${fmt(c.length)} ${t("candidates")}`; body=c.sort((a,b)=>a[ST].localeCompare(b[ST])).map(x=>candLine(x)).join(""); }
    else if(key==="maire"){ const c=s.c.filter(x=>x[G]===un.k); meta=`${t("maire")} · ${fmt(new Set(c.map(cartelKey)).size)} ${t("cartelsL")}`; body=cartelsHtml(c); }
    else { const c=s.c.filter(x=>comOf(key,x)===un.k); const secs=(UNITS.sec[d]||[]).filter(k=>D.sections[k][1]===un.k);
      meta=`${t(key)} · ${fmt(new Set(c.map(cartelKey)).size)} ${t("cartelsL")} · ${secs.length} ${uLabel("sec",true)}`;
      body=secs.map(sk=>{const cs=c.filter(x=>x[G]===sk); return `<h3 style="font-size:15px;margin:12px 0 2px">${esc(title(D.sections[sk][0]))} <span style="font-weight:400;color:${cs.length?"var(--muted)":"var(--empty)"};font-size:13px">· ${cs.length?new Set(cs.map(cartelKey)).size+" "+t("cartelsL"):t("legendNone")}</span></h3>${cartelsHtml(cs)}`;}).join("")
        + (()=>{const o=c.filter(x=>!D.sections[x[G]]); return o.length?cartelsHtml(o):"";})(); }
    el.innerHTML=`<button class="back" data-back>${t("back")}</button><h3>${esc(unitName(un.u,un.k))}</h3><div class="meta">${esc(dn(d))} · ${meta}</div><div class="scroll">${body||`<div class="hint">${t("legendNone")}</div>`}</div>`;
    return;
  }
  let head=`<h3>${esc(dn(d))}</h3><div class="meta">${t(key)} · ${fmt(s.n)} ${t("candidates")}${s.cartels!=null?" · "+fmt(s.cartels)+" "+t("cartelsL"):""} · ${t("women")} ${pc(s.f,s.n)}${u?` · ${t(state.phase==="depot"?"emptyDepot":"empty",{u:uLabel(u,true)})} : ${s.units-s.covered}/${s.units}`:""}</div>`;
  if(key==="senat"){ el.innerHTML=head+`<div class="scroll">${s.c.slice().sort((a,b)=>a[ST].localeCompare(b[ST])).map(x=>candLine(x)).join("")}</div>`; return; }
  let units;
  if(u==="circ") units=(UNITS.circ[d]||[]).map(k=>({u:"circ",k,n:s.c.filter(x=>x[G]===k).length}));
  else units=(UNITS.com[d]||[]).map(k=>{const c=s.c.filter(x=>comOf(key,x)===k); const extra = u==="sec"? (()=>{const secs=(UNITS.sec[d]||[]).filter(sk=>D.sections[sk][1]===k); const cov=secs.filter(sk=>c.some(x=>x[G]===sk)).length; return `${cov}/${secs.length} ${uLabel("sec",true)}`;})() : ""; return {u:"com",k,n:new Set(c.map(cartelKey)).size,extra};});
  units.sort((a,b)=>b.n-a.n||unitName(a.u,a.k).localeCompare(unitName(b.u,b.k)));
  el.innerHTML=head+`<div class="scroll">${units.map(x=>`<div class="unit" data-unit="${x.u}:${x.k}"><div><div class="n">${esc(unitName(x.u,x.k))}</div>${x.extra?`<div class="x">${x.extra}</div>`:""}</div><div class="c ${x.n||state.phase==="depot"?"":"zero"}">${x.n} ${x.u==="circ"?t("candidates"):t("cartelsL")}</div></div>`).join("")}</div>`;
}

  const pts=D.trend.map(r=>({d:new Date(r[0]),v:keys.reduce((a,k)=>a+r[idx[k]],0),by:Object.fromEntries(POSKEYS.map(k=>[k,r[idx[k]]]))}));
  const x=d3.scaleTime().domain(d3.extent(pts,p=>p.d)).range([m.l,W-m.r]);
  const y=d3.scaleLinear().domain([0,d3.max(pts,p=>p.v)*1.08]).nice().range([H-m.b,m.t]);
  s.append("g").attr("class","axis").attr("transform",`translate(0,${H-m.b})`).call(d3.axisBottom(x).ticks(7).tickFormat(d=>d.toLocaleDateString(state.lang==="fr"?"fr-FR":"fr-HT",{day:"numeric",month:"short"})));

    .append("title").text(p=>p.d.toLocaleDateString("fr-FR")+" : "+fmt(p.v));

function renderParties(){
  const keys=state.tab==="all"?POSKEYS:[state.tab];
  const rows={};
  for(const k of POSKEYS) for(const c of pool(k)){ const r=rows[c[ST]]??={st:c[ST],total:0,f:0,d:new Set()}; r[k]=(r[k]||0)+1; if(keys.includes(k)){ r.total++; if(c[SX]==="F") r.f++; if(c[DP]) r.d.add(c[DP]); } }
  let list=Object.values(rows).filter(r=>r.total>0); const q=state.pq.trim().toLowerCase(); if(q) list=list.filter(r=>r.st.toLowerCase().includes(q));
  const sk=state.sort.k, sd=state.sort.d;
  list.sort((a,b)=> sk==="st"? sd*a.st.localeCompare(b.st) : sk==="women"? sd*((a.f/a.total)-(b.f/b.total)) : sk==="depts"? sd*(a.d.size-b.d.size) : sd*((a[sk]||0)-(b[sk]||0)));

   ${list.map((r,i)=>`<tr><td class="l">${i+1}</td><td class="l"><b>${esc(r.st)}</b></td>${cols.map(k=>`<td>${r[k]?fmt(r[k]):"·"}</td>`).join("")}<td><b>${fmt(r.total)}</b></td><td>${pc(r.f,r.total,0)}</td><td>${r.d.size}</td></tr>`).join("")}</tbody></table>`;
}

const PER=50;

function renderList(){

   ${sl.map(({k,c,place})=>`<tr><td class="l"><b>${esc(c[N])}</b></td><td class="l"><span class="sx ${c[SX]}">${c[SX]}</span></td><td class="l">${esc(c[ST])}</td>${state.tab==="all"?`<td class="l">${t(k)}</td>`:""}<td class="l">${posLabel(c[RK])}</td><td class="l">${esc(dn(c[DP]))}</td><td class="l">${esc(place)}</td><td>${new Date(c[DA]).toLocaleDateString("fr-FR")}</td><td>${c[DEP]?(c[DD]?new Date(c[DD]).toLocaleDateString("fr-FR"):"✓"):"—"}</td></tr>`).join("")}</tbody></table>`;

}

function render(){ renderStatic(); renderStatus(); renderKpis(); renderPres(); if(state.tab!=="president"){ renderMap(); renderDetail(); } renderTrend(); renderParties(); renderList(); }

/* ---------------- Événements ---------------- */
document.querySelector(".lang").addEventListener("click",e=>{const b=e.target.closest("button"); if(!b) return; state.lang=b.dataset.lang; try{localStorage.setItem("lang",state.lang);}catch(_){}; render();});
document.getElementById("tabs").addEventListener("click",e=>{const b=e.target.closest("button"); if(!b) return; state.tab=b.dataset.tab; state.unit=null; state.page=0; location.hash=state.tab; render();});
document.getElementById("status").addEventListener("click",e=>{const b=e.target.closest("[data-phase]"); if(!b) return; state.phase=b.dataset.phase; state.page=0; render();});
document.getElementById("maptools").addEventListener("click",e=>{const b=e.target.closest("button"); if(b){ state.view=b.dataset.view; render(); }});
document.getElementById("maptools").addEventListener("change",e=>{ if(e.target.id==="bub"){ state.bubbles=e.target.checked; renderMap(); }});
document.getElementById("detail").addEventListener("click",e=>{
  if(e.target.closest("[data-back]")){ state.unit=null; render(); return; }
  const u=e.target.closest("[data-unit]"); if(u){ const [uu,k]=u.dataset.unit.split(/:(.*)/s); state.unit={id:uu+":"+k,u:uu,k:uu==="circ"?+k:k}; render(); return; }
  const g=e.target.closest("[data-goto]"); if(g){ state.tab=g.dataset.goto; location.hash=state.tab; render(); }
});
document.getElementById("pSearch").addEventListener("input",e=>{state.pq=e.target.value; renderParties();});
document.getElementById("parties").addEventListener("click",e=>{const h=e.target.closest("[data-sort]"); if(!h) return; const k=h.dataset.sort; state.sort= state.sort.k===k? {k,d:-state.sort.d} : {k,d:k==="st"?1:-1}; renderParties();});
document.getElementById("lSearch").addEventListener("input",e=>{state.lq=e.target.value; state.page=0; renderList();});
document.getElementById("lDept").addEventListener("change",e=>{state.ld=e.target.value; state.page=0; renderList();});
document.getElementById("pager").addEventListener("click",e=>{const b=e.target.closest("[data-pg]"); if(!b) return; state.page+= +b.dataset.pg; renderList();});
const fromHash=()=>{const h=location.hash.slice(1); if(["all",...POSKEYS].includes(h)) state.tab=h;};
window.addEventListener("hashchange",()=>{fromHash(); state.unit=null; render();});
fromHash(); render();
</script>
</body>
</html>
